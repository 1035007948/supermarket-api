spring:
  application:
    name: supermarket-api
  
  datasource:
    url: jdbc:h2:mem:supermarket;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

jwt:
  secret: supermarket-api-jwt-secret-key-2024-super-long-secret-key-for-security
  expiration: 86400000

logging:
  level:
    com.supermarket: DEBUG
    org.springframework.security: DEBUG
